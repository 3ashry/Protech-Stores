name: Bosta status sync

# Runs twice a day (≈ 8:00 and 20:00 Cairo time) and also on manual trigger.
# The evening run ALSO fires today's Telegram summary (via ?summary=1) so
# there's no need for a separate cron.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Bosta sync
        env:
          # GitHub cron passes the matched schedule to $GITHUB_EVENT_NAME=schedule
          # and $CRON_SCHEDULE in the workflow's schedule metadata isn't exposed;
          # detect the evening run by the current UTC hour instead.
          SCHEDULE_HOUR: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE_HOUR" = "0 18 * * *" ]; then
            echo "Evening run — running sync + daily Telegram summary"
            URL="https://protech-stores.vercel.app/api/sync-status?summary=1"
          else
            echo "Regular sync"
            URL="https://protech-stores.vercel.app/api/sync-status"
          fi
          # 310s client timeout (Vercel's hard function limit is 300s + a
          # tiny edge-proxy allowance). -S shows errors but we don't -f —
          # a 504 means the function hit its budget cap and already made
          # progress on the orders it had time for. Flagging the whole
          # workflow failed on that would spam the inbox for runs that
          # actually did their job.
          HTTP_CODE=$(curl -sS -o /tmp/sync.out -w "%{http_code}" --max-time 310 -X POST "$URL" || echo "000")
          echo "HTTP $HTTP_CODE"
          cat /tmp/sync.out || true
          case "$HTTP_CODE" in
            2*) exit 0 ;;
            504|000) echo "::warning::Sync hit the Vercel duration cap or network timeout. Partial progress likely — next cron will continue." ; exit 0 ;;
            *) echo "::error::Sync returned HTTP $HTTP_CODE" ; exit 1 ;;
          esac
