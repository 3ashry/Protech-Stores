<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F26A21">
<title>بروتيك — تجهيز الطلبات</title>
<link rel="icon" href="/favicon.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --orange: #F26A21;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f7f7f8;
    --card: #fff;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --danger: #dc2626;
  }
  html, body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; }
  header { background: var(--orange); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  header h1 { margin: 0; font-size: 17px; font-weight: 800; flex-shrink: 1; min-width: 0; }
  header .head-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  header .count { background: rgba(255,255,255,.25); padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  /* Monthly output pill — circular chip with big count, tiny subline. */
  .month-pill { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 54px; height: 54px; border-radius: 999px; background: #fff; color: var(--orange); padding: 2px 12px; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,.15); border: 2px solid #fff; line-height: 1; }
  .month-pill .m-val { font-size: 22px; letter-spacing: -0.02em; }
  .month-pill .m-lbl { font-size: 8px; letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; color: #b34500; font-weight: 800; }

  main { padding: 12px; max-width: 720px; margin: 0 auto; padding-bottom: 100px; }

  /* Two-stage tabs: 🧰 preparing → ✅ ready */
  .tabs { display: flex; gap: 0; background: #fff; border-bottom: 2px solid var(--line); position: sticky; top: 52px; z-index: 15; padding: 0 12px; max-width: 720px; margin: 0 auto; }
  .tab { flex: 1; background: transparent; border: 0; padding: 14px 8px; font-family: inherit; font-size: 13px; font-weight: 800; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .tab.active { color: var(--orange); border-bottom-color: var(--orange); }
  .tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--line); color: var(--ink); font-size: 11px; font-weight: 800; }
  .tab.active .tab-count { background: var(--orange); color: #fff; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 12px; border: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; font-size: 14px; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 700; text-align: end; }
  .order-code { display: inline-block; background: var(--orange); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; margin-bottom: 8px; }
  .badge-open { display: inline-block; background: #fef3c7; color: #92400e; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; margin-inline-start: 6px; border: 1px solid #fcd34d; }
  h2.customer { margin: 0 0 8px 0; font-size: 18px; font-weight: 800; }
  .address { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .products { background: #f9fafb; border-radius: 10px; padding: 10px; margin: 10px 0; }
  .prod { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #e5e7eb; font-size: 14px; }
  .prod:last-child { border-bottom: 0; }
  .prod .qty { font-weight: 800; color: var(--orange); font-size: 15px; white-space: nowrap; }
  .prod .code { color: var(--muted); font-size: 12px; direction: ltr; text-align: start; }
  .total { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--success-bg); color: var(--success); border-radius: 8px; margin: 10px 0; font-weight: 800; font-size: 16px; }
  .btn { display: inline-block; padding: 12px 16px; border-radius: 10px; border: 0; font-weight: 800; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-success { background: var(--success); color: #fff; width: 100%; margin-top: 8px; }
  .ready-banner { width: 100%; margin-top: 8px; padding: 12px; background: var(--success-bg); color: var(--success); border: 1px dashed var(--success); border-radius: 8px; text-align: center; font-weight: 800; font-size: 14px; }

  /* In-page notification banner. Fixed top strip that slides in when a
     new incoming or returning order appears — click to jump to that tab. */
  .banner { position: fixed; top: 12px; inset-inline-start: 12px; inset-inline-end: 12px; z-index: 200; max-width: 640px; margin: 0 auto; padding: 14px 18px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.25); color: #fff; font-weight: 800; display: flex; align-items: center; gap: 12px; cursor: pointer; transform: translateY(-140%); transition: transform .3s cubic-bezier(.2,.9,.3,1.2); }
  .banner.show { transform: translateY(0); }
  .banner.incoming  { background: linear-gradient(135deg, var(--orange), #d4551a); }
  .banner.returning { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
  .banner .em { font-size: 22px; }
  .banner .msg { flex: 1; font-size: 14px; line-height: 1.4; }
  .banner .msg small { display: block; opacity: .9; font-weight: 600; margin-top: 2px; }
  .banner .close { background: rgba(255,255,255,.2); border: 0; color: #fff; font-size: 18px; cursor: pointer; padding: 4px 10px; border-radius: 6px; font-weight: 800; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .call-btns { display: flex; gap: 8px; margin-top: 8px; }
  .call-btns a { flex: 1; text-decoration: none; text-align: center; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 14px; }
  .call-btns .call { background: #dbeafe; color: #1e40af; }
  .call-btns .wa { background: #dcfce7; color: #15803d; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .em { font-size: 56px; margin-bottom: 12px; }
  .fab { position: fixed; bottom: 20px; inset-inline-end: 20px; background: var(--orange); color: #fff; border: 0; width: auto; padding: 14px 20px; border-radius: 999px; font-weight: 800; font-size: 15px; box-shadow: 0 6px 16px rgba(242,106,33,.4); cursor: pointer; font-family: inherit; z-index: 15; }

  /* PIN gate */
  .gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; padding: 20px; }
  .gate .logo { font-size: 40px; margin-bottom: 12px; }
  .gate h1 { margin: 0 0 6px 0; font-size: 24px; color: var(--orange); }
  .gate p { color: var(--muted); margin: 0 0 24px 0; }
  .gate input { width: 100%; max-width: 260px; padding: 14px; font-size: 22px; text-align: center; border: 2px solid var(--line); border-radius: 12px; letter-spacing: 8px; font-family: inherit; }
  .gate input:focus { outline: none; border-color: var(--orange); }
  .gate .err { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .gate button { margin-top: 14px; width: 100%; max-width: 260px; }

  /* Picking-list modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 20px; }
  .modal.open { display: flex; }
  .modal .sheet { background: #fff; border-radius: 14px; width: 100%; max-width: 500px; padding: 18px; margin: 20px 0; }
  .modal h3 { margin: 0 0 12px 0; }
  .modal .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); align-items: center; }
  .modal .item .n { font-weight: 700; }
  .modal .item .c { font-size: 11px; color: var(--muted); direction: ltr; text-align: start; }
  .modal .item .q { font-weight: 800; color: var(--orange); font-size: 16px; grid-row: span 2; }
  .modal .close { background: transparent; border: 0; font-size: 22px; float: inline-end; cursor: pointer; color: var(--muted); }

  @media print {
    header, .fab, .modal .close, .btn-success, .call-btns { display: none !important; }
    .card, body { box-shadow: none !important; }
  }
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate" class="gate">
  <div class="logo">📦</div>
  <h1>بروتيك — تجهيز الطلبات</h1>
  <p>سجّل الدخول بحسابك</p>
  <input id="username-input" type="text" placeholder="اسم المستخدم" autocomplete="username" style="width:100%;max-width:260px;padding:14px;font-size:18px;text-align:center;border:2px solid var(--line);border-radius:12px;font-family:inherit;margin-bottom:10px">
  <input id="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="****" maxlength="10" autocomplete="current-password">
  <div id="pin-err" class="err"></div>
  <button class="btn btn-primary" onclick="tryLogin()">دخول</button>
</div>

<!-- In-page notification banner -->
<div id="banner" class="banner" onclick="onBannerClick()">
  <span class="em" id="banner-em">🛒</span>
  <div class="msg" id="banner-msg">…</div>
  <button class="close" onclick="event.stopPropagation(); hideBanner()">✕</button>
</div>

<!-- APP (hidden until logged in) -->
<div id="app" style="display:none">
  <header>
    <h1>📦 تجهيز الطلبات</h1>
    <div class="head-right">
      <span class="count" id="count">…</span>
      <div class="month-pill" id="month-pill" title="عدد الطلبات التي جهزتها هذا الشهر">
        <span class="m-val" id="month-val">0</span>
        <span class="m-lbl" id="month-lbl">هذا الشهر</span>
      </div>
    </div>
  </header>
  <div class="tabs">
    <button id="tab-preparing" class="tab active" onclick="switchTab('preparing')">
      🧰 قيد التجهيز <span class="tab-count" id="tab-count-preparing">0</span>
    </button>
    <button id="tab-ready" class="tab" onclick="switchTab('ready')">
      ✅ جاهزة للاستلام <span class="tab-count" id="tab-count-ready">0</span>
    </button>
    <button id="tab-returning" class="tab" onclick="switchTab('returning')">
      ↩️ راجعة من بوسطة <span class="tab-count" id="tab-count-returning">0</span>
    </button>
  </div>
  <main>
    <div id="list"></div>
  </main>
  <button class="fab" onclick="openTodayList()">📋 قائمة اليوم</button>
</div>

<!-- Today's picking list modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" onclick="closeModal()">✕</button>
    <h3>📋 قائمة اليوم — كل الأصناف</h3>
    <div id="modal-body"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="window.print()">🖨️ طباعة</button>
  </div>
</div>

<script>
const API = '/api/sync-status?action=picker';
const CREDS_KEY = 'protech_picker_creds_v2';

function getCreds() {
  try { const raw = sessionStorage.getItem(CREDS_KEY); return raw ? JSON.parse(raw) : {}; }
  catch { return {}; }
}
function saveCreds(c) { try { sessionStorage.setItem(CREDS_KEY, JSON.stringify(c)); } catch {} }
function clearCreds() { try { sessionStorage.removeItem(CREDS_KEY); } catch {} }

async function apiCall(op, extra = {}) {
  const c = getCreds();
  const q = new URLSearchParams({ op, username: c.username || '', pin: c.pin || '', ...extra }).toString();
  const r = await fetch(`${API}&${q}`);
  if (r.status === 401) { clearCreds(); showGate('اسم المستخدم أو الرمز غير صحيح'); throw new Error('unauth'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'server error');
  return j;
}

function showGate(err) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('pin-err').textContent = err || '';
  setTimeout(() => document.getElementById('username-input').focus(), 50);
}
function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadOrders();
}

async function tryLogin() {
  const u = document.getElementById('username-input').value.trim();
  const p = document.getElementById('pin-input').value.trim();
  if (!u || !p) { document.getElementById('pin-err').textContent = 'اكتب اسم المستخدم والرمز'; return; }
  saveCreds({ username: u, pin: p });
  try { await apiCall('list'); showApp(); }
  catch (e) { /* apiCall already handled 401 */ }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('gate').style.display !== 'none') tryLogin();
});

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }
function money(n) { const x = Number(n||0); return x.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function waLink(phone, name) {
  const p = String(phone||'').replace(/[^0-9+]/g, '');
  return `https://wa.me/${p.replace(/^\+/, '')}`;
}
function telLink(phone) {
  const p = String(phone||'').replace(/[^0-9+]/g, '');
  return 'tel:' + p;
}

// Bosta business dashboard — open the order detail page directly by
// tracking number. Bosta's /orders/<id> route accepts the tracking
// number as the identifier, landing on the customer + shipment
// screen where "Print AWB" is one tap away.
function bostaAwbLink(shipCode) {
  if (!shipCode) return '';
  return `https://business.bosta.co/orders/${encodeURIComponent(shipCode)}`;
}

function orderCard(o, tab) {
  const products = (o.products || []).map(p => `
    <div class="prod">
      <div>
        <div>${esc(p.name || p.code || 'منتج')}</div>
        <div class="code">${esc(p.code || '')}</div>
      </div>
      <div class="qty">×${p.qty}</div>
    </div>`).join('');
  const bostaBtn = o.ship_code
    ? `<a class="wa" href="${bostaAwbLink(o.ship_code)}" target="_blank" rel="noopener">🚚 فتح بوسطة (AWB)</a>`
    : `<span class="wa" style="opacity:.5;cursor:not-allowed" title="لا يوجد كود شحن مسجل بعد">🚚 لا يوجد كود شحن</span>`;
  // Bottom action per tab:
  //   • preparing → "✅ تم التجهيز" button (flips row into "ready")
  //   • ready     → waiting-for-Bosta banner (no action)
  //   • returning → "✅ تم الاستلام في المخزن" — confirms the parcel is
  //                 physically back in the warehouse
  let bottomAction;
  if (tab === 'ready') {
    bottomAction = `<div class="ready-banner">⏳ في انتظار استلام بوسطة</div>`;
  } else if (tab === 'returning') {
    bottomAction = `<button class="btn btn-success" style="background:#7c3aed" onclick="confirmReceivedBack('${esc(o.id)}', this)">✅ تم الاستلام في المخزن</button>`;
  } else {
    bottomAction = `<button class="btn btn-success" onclick="markPrepared('${esc(o.id)}', this)">✅ تم التجهيز</button>`;
  }
  return `
    <div class="card">
      <span class="order-code">${esc(o.code || '')}</span>
      ${o.allow_open ? '<span class="badge-open">📦 فتح الشحنة</span>' : ''}
      <h2 class="customer">${esc(o.customer_name || 'عميل')}</h2>
      <div class="address">📍 ${esc(o.city || '')}${o.address ? ' — ' + esc(o.address) : ''}</div>
      ${o.notes ? `<div class="address" style="color:#92400e;background:#fef3c7;padding:6px 8px;border-radius:6px;margin:6px 0">📝 ${esc(o.notes)}</div>` : ''}
      <div class="call-btns">
        <a class="call" href="javascript:void(0)" onclick="printInvoice('${esc(o.id)}')">🧾 طباعة الفاتورة</a>
        ${bostaBtn}
      </div>
      <div class="products">${products || '<em style="color:var(--muted)">لا يوجد منتجات مضافة</em>'}</div>
      <div class="total"><span>الإجمالي</span><span>${money(o.total)} ج.م</span></div>
      ${bottomAction}
    </div>`;
}

// Print the customer-facing invoice — same template as the admin's
// generateInvoicePDF so both surfaces produce the same document.
async function printInvoice(orderId) {
  try {
    const j = await apiCall('invoice', { orderId });
    const order = j.order;
    if (!order) throw new Error('Order not found');

    const rows = Array.isArray(order.products) ? order.products : [];
    const productRows = rows.length
      ? rows.map(p => `
          <tr>
            <td class="code">${esc(p.code) || '—'}</td>
            <td class="name">${esc(p.name) || '—'}</td>
            <td>${p.qty || 1}</td>
            <td>${(p.price || 0).toLocaleString('en-US')}</td>
            <td><strong>${((p.price || 0) * (p.qty || 1)).toLocaleString('en-US')}</strong></td>
          </tr>`).join('')
      : '<tr><td colspan="5" style="padding:20px;color:#999">لا توجد منتجات</td></tr>';

    const shipFee = Number(order.est_shipping) || 0;
    const shipRow = shipFee > 0 ? `
      <tr class="ship-row">
        <td colspan="3"></td>
        <td class="ship-label">الشحن</td>
        <td>${shipFee.toLocaleString('en-US')}</td>
      </tr>` : '';

    let orderDate = '—';
    if (order.created_at) {
      const dt = new Date(order.created_at);
      if (!isNaN(dt)) {
        const dd = String(dt.getDate()).padStart(2, '0');
        const mm = String(dt.getMonth() + 1).padStart(2, '0');
        orderDate = `${dd}/${mm}/${dt.getFullYear()}`;
      }
    }

    const invoiceHTML = `<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8"/>
  <title>فاتورة — ${esc(order.code || order.id)}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', 'Segoe UI', Arial, sans-serif; padding: 40px 44px 0; color: #222; direction: rtl; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet { max-width: 720px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
    .logo { height: 70px; width: auto; object-fit: contain; }
    .invoice-title { font-size: 56px; font-weight: 900; color: #b34500; letter-spacing: -2px; line-height: 1; }
    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40px; margin-bottom: 24px; padding: 16px 0; border-top: 1px solid #ececec; border-bottom: 1px solid #ececec; }
    .info-row { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 6px 18px; align-items: baseline; font-size: 12.5px; }
    .info-row .lbl { color: #f97316; font-weight: 700; }
    .info-row .val { color: #222; font-weight: 700; text-align: end; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { background: #f97316; color: #fff; padding: 10px 8px; text-align: center; font-weight: 700; font-size: 12px; }
    tbody td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tbody td.code { font-weight: 700; letter-spacing: .02em; }
    tbody td.name { text-align: start; }
    tbody .ship-row td { border: 0; padding-top: 14px; padding-bottom: 4px; color: #f97316; font-weight: 700; }
    tbody .ship-row td.ship-label { text-align: end; padding-inline-end: 12px; }
    .grand { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #f97316; margin-top: 8px; padding: 18px 8px 22px; }
    .grand .lbl { color: #f97316; font-weight: 700; font-size: 15px; }
    .grand .val { font-family: 'Cairo', sans-serif; font-size: 36px; font-weight: 900; color: #222; line-height: 1; }
    .grand .val span { color: #f97316; font-size: 20px; font-weight: 800; margin-inline-start: 6px; }
    .footer { background: #2b2b2b; color: #fff; padding: 22px 30px; margin: 30px -44px 0; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .footer .tag { font-weight: 800; font-size: 17px; line-height: 1.4; }
    .footer .tag .or { color: #f97316; }
    .footer .contact { text-align: start; font-size: 12px; line-height: 1.7; }
    .footer .contact a { color: #f97316; text-decoration: none; font-weight: 700; }
    .no-print { text-align: end; margin: 0 auto 16px; max-width: 720px; }
    .no-print button { background: #f97316; color: #fff; padding: 10px 20px; border: 0; border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    @page { size: A4; margin: 0; }
    @media print { body { padding: 20mm 20mm 0; } .no-print { display: none !important; } .footer { margin: 30px -20mm 0; padding: 22px 20mm; } }
  </style>
</head>
<body>
  <div class="no-print"><button onclick="window.print()">🖨️ طباعة / حفظ PDF</button></div>
  <div class="sheet">
    <div class="header">
      <img src="/favicon.png" alt="Protech" class="logo">
      <div class="invoice-title">فاتوره</div>
    </div>
    <div class="info">
      <div>
        <div class="info-row"><span class="lbl">رقم الفاتوره</span><span class="val">${esc(order.code || order.id)}</span></div>

        <div class="info-row"><span class="lbl">تليفون العميل</span><span class="val" style="direction:ltr;unicode-bidi:embed">${esc(order.phone) || '—'}</span></div>
      </div>

      للتواصل كلما علي: <a href="tel:01034482071">01034482071</a><br>

    const win = window.open('', '_blank', 'width=850,height=1000');
    if (!win) { alert('يرجى السماح بالنوافذ المنبثقة لطباعة الفاتورة'); return; }
    win.document.open(); win.document.write(invoiceHTML); win.document.close();
  } catch (e) { alert('تعذّر توليد الفاتورة: ' + e.message); }
}

// Which tab is currently visible. Persist across refreshes so the picker
// doesn't get bounced back to "preparing" on every reload.
let activeTab = (function() { try { return sessionStorage.getItem('protech_picker_tab_v1') || 'preparing'; } catch { return 'preparing'; } })();
function saveActiveTab() { try { sessionStorage.setItem('protech_picker_tab_v1', activeTab); } catch {} }

function _refreshTabButtons() {
  document.getElementById('tab-preparing').classList.toggle('active', activeTab === 'preparing');
  document.getElementById('tab-ready').classList.toggle('active', activeTab === 'ready');
  document.getElementById('tab-returning').classList.toggle('active', activeTab === 'returning');
}
function switchTab(tab) {
  activeTab = tab; saveActiveTab();
  _refreshTabButtons();
  loadOrders();
}

// Tracks the IDs we've already shown so we only fire notifications for
// NEWLY arrived orders (not the whole list on every refresh).
// `null` on first load means "just observe, don't ring" — we don't want a
// shower of notifications the first time the page opens.
let _knownPreparing = null, _knownReturning = null;

async function loadOrders(opts) {
  const silent = !!(opts && opts.silent);
  document.getElementById('list').innerHTML = '<div class="empty">جاري التحميل…</div>';
  try {
    // Fetch all three queues + monthly stats in parallel. Tab counters
    // and the "هذا الشهر" pill stay live regardless of the visible tab.
    const [preparing, ready, returning, stats] = await Promise.all([
      apiCall('list').catch(() => ({ orders: [] })),
      apiCall('ready').catch(() => ({ orders: [] })),
      apiCall('returning').catch(() => ({ orders: [] })),
      apiCall('stats').catch(() => ({ preparedThisMonth: 0, monthLabel: '' })),
    ]);
    // Update the monthly-output pill (top-right of the header).
    const mVal = document.getElementById('month-val');
    const mLbl = document.getElementById('month-lbl');
    if (mVal) mVal.textContent = stats.preparedThisMonth || 0;
    if (mLbl) mLbl.textContent = stats.monthLabel || 'هذا الشهر';
    const pOrders = preparing.orders || [];
    const rOrders = ready.orders || [];
    const bOrders = returning.orders || [];
    // Diff against last snapshot — anything new fires a notification.
    if (!silent && _knownPreparing !== null) {
      const fresh = pOrders.filter(o => !_knownPreparing.has(o.id));
      if (fresh.length) notifyIncoming(fresh);
    }
    if (!silent && _knownReturning !== null) {
      const fresh = bOrders.filter(o => !_knownReturning.has(o.id));
      if (fresh.length) notifyReturning(fresh);
    }
    _knownPreparing = new Set(pOrders.map(o => o.id));
    _knownReturning = new Set(bOrders.map(o => o.id));
    document.getElementById('tab-count-preparing').textContent = pOrders.length;
    document.getElementById('tab-count-ready').textContent = rOrders.length;
    document.getElementById('tab-count-returning').textContent = bOrders.length;
    const orders = activeTab === 'ready' ? rOrders
                 : activeTab === 'returning' ? bOrders
                 : pOrders;
    document.getElementById('count').textContent = `${orders.length} طلب`;
    const emptyMsg = {
      preparing: ['✅', 'لا توجد طلبات لتجهيزها الآن'],
      ready:     ['📭', 'لا توجد طلبات جاهزة للاستلام'],
      returning: ['🏠', 'لا توجد طلبات راجعة من بوسطة'],
    }[activeTab];
    document.getElementById('list').innerHTML = orders.length
      ? orders.map(o => orderCard(o, activeTab)).join('')
      : `<div class="empty"><div class="em">${emptyMsg[0]}</div><div>${emptyMsg[1]}</div></div>`;
    _refreshTabButtons();
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="empty"><div class="em">⚠️</div><div>خطأ: ${esc(e.message)}</div></div>`;
  }
}

async function confirmReceivedBack(orderId, btn) {
  if (!confirm('تأكيد استلام هذا الطلب في المخزن؟\n(سيتم إخراجه من قائمة الطلبات الراجعة)')) return;
  btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try {
    await apiCall('receive-back', { orderId });
    btn.closest('.card').style.transition = 'opacity .3s'; btn.closest('.card').style.opacity = '0';
    setTimeout(() => loadOrders(), 300);
  } catch (e) {
    btn.disabled = false; btn.textContent = '✅ تم الاستلام في المخزن';
    alert('فشل الحفظ: ' + e.message);
  }
}

async function markPrepared(orderId, btn) {
  if (!confirm('تأكيد تجهيز هذا الطلب؟')) return;
  btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try {
    await apiCall('mark', { orderId });
    // Optimistically remove the card from view.
    btn.closest('.card').style.transition = 'opacity .3s'; btn.closest('.card').style.opacity = '0';
    setTimeout(() => loadOrders(), 300);
  } catch (e) {
    btn.disabled = false; btn.textContent = '✅ تم التجهيز';
    alert('فشل الحفظ: ' + e.message);
  }
}

async function openTodayList() {
  document.getElementById('modal-body').innerHTML = '<div class="empty">جاري التحميل…</div>';
  document.getElementById('modal').classList.add('open');
  try {
    const j = await apiCall('today');
    const items = j.items || [];
    document.getElementById('modal-body').innerHTML = items.length
      ? items.map(i => `
          <div class="item">
            <div class="n">${esc(i.name || i.code)}</div>
            <div class="q">×${i.qty}</div>
            <div class="c">${esc(i.code || '')}</div>
            <div></div>
          </div>`).join('')
      : '<div class="empty">لا توجد أصناف</div>';
  } catch (e) {
    document.getElementById('modal-body').innerHTML = `<div class="empty">خطأ: ${esc(e.message)}</div>`;
  }
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

// ═══════════════ NOTIFICATIONS ══════════════════════════════════
// Two channels:
//   1. In-page banner strip at the top (always works, no permission).
//   2. Native OS notification banner via the Notification API — asked
//      for on the first successful login. If the user denies, only the
//      in-page banner + audio chime run.
// Plus a short chime so the operations manager notices even without
// looking at the screen.
let _bannerTimer = null;
let _lastBannerTarget = null;   // remember which tab a banner points to

function requestNotifPerm() {
  try {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') Notification.requestPermission();
  } catch {}
}

function playChime() {
  // No audio file dependency — synth a short beep with WebAudio.
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.6);
  } catch {}
}

function showBanner(kind, emoji, title, subtitle) {
  const el = document.getElementById('banner');
  if (!el) return;
  el.classList.remove('incoming', 'returning');
  el.classList.add(kind === 'returning' ? 'returning' : 'incoming');
  document.getElementById('banner-em').textContent = emoji;
  document.getElementById('banner-msg').innerHTML = `${esc(title)}<small>${esc(subtitle || 'اضغط لعرض التفاصيل')}</small>`;
  _lastBannerTarget = kind === 'returning' ? 'returning' : 'preparing';
  el.classList.add('show');
  clearTimeout(_bannerTimer);
  _bannerTimer = setTimeout(hideBanner, 8000);
}
function hideBanner() { document.getElementById('banner').classList.remove('show'); }
function onBannerClick() {
  if (_lastBannerTarget && activeTab !== _lastBannerTarget) switchTab(_lastBannerTarget);
  hideBanner();
}

function sysNotify(title, body, kind) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const n = new Notification(title, { body, icon: '/favicon.png', tag: 'picker-' + kind, renotify: true });
    n.onclick = () => { window.focus(); if (kind === 'returning') switchTab('returning'); else switchTab('preparing'); n.close(); };
    setTimeout(() => { try { n.close(); } catch {} }, 12000);
  } catch {}
}

function notifyIncoming(freshOrders) {
  const first = freshOrders[0] || {};
  const title = freshOrders.length === 1
    ? `🛒 طلب جديد للتجهيز — ${first.code || ''}`
    : `🛒 ${freshOrders.length} طلبات جديدة للتجهيز`;
  const body = freshOrders.length === 1
    ? `${first.customer_name || ''} — ${first.city || ''}`
    : `أولها: ${first.code || ''} — ${first.customer_name || ''}`;
  playChime();
  showBanner('incoming', '🛒', title, body);
  sysNotify(title, body, 'incoming');
}
function notifyReturning(freshOrders) {
  const first = freshOrders[0] || {};
  const title = freshOrders.length === 1
    ? `↩️ طلب راجع من بوسطة — ${first.code || ''}`
    : `↩️ ${freshOrders.length} طلبات راجعة من بوسطة`;
  const body = freshOrders.length === 1
    ? `${first.customer_name || ''} — ${first.city || ''}`
    : `أولها: ${first.code || ''} — ${first.customer_name || ''}`;
  playChime();
  showBanner('returning', '↩️', title, body);
  sysNotify(title, body, 'returning');
}

// Boot — auto-enter if credentials are already saved for this session
{
  const c = getCreds();
  if (c.username && c.pin) apiCall('list').then(() => { showApp(); requestNotifPerm(); }).catch(() => showGate(''));
  else showGate('');
}
// Request notification permission whenever the user logs in fresh too.
document.addEventListener('click', () => requestNotifPerm(), { once: true });

// Refresh every 15s while visible so new orders + admin un-sends
// show up quickly on the picker screen without a manual reload.
// 15s stays well inside Bosta / Vercel rate limits while feeling
// near-instant to the operations manager.
setInterval(() => {
  if (document.getElementById('app').style.display !== 'none' && !document.hidden) loadOrders();
}, 15000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.getElementById('app').style.display !== 'none') loadOrders();
});
</script>
