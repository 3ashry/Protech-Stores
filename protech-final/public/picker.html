<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F26A21">
<title>بروتيك — تجهيز الطلبات</title>
<link rel="icon" href="/favicon.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --orange: #F26A21;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f7f7f8;
    --card: #fff;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --danger: #dc2626;
  }
  html, body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; }
  header { background: var(--orange); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  header h1 { margin: 0; font-size: 18px; font-weight: 800; }
  header .count { background: rgba(255,255,255,.25); padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }

  main { padding: 12px; max-width: 720px; margin: 0 auto; padding-bottom: 100px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 12px; border: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; font-size: 14px; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 700; text-align: end; }
  .order-code { display: inline-block; background: var(--orange); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; margin-bottom: 8px; }
  .badge-open { display: inline-block; background: #fef3c7; color: #92400e; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; margin-inline-start: 6px; border: 1px solid #fcd34d; }
  h2.customer { margin: 0 0 8px 0; font-size: 18px; font-weight: 800; }
  .address { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .products { background: #f9fafb; border-radius: 10px; padding: 10px; margin: 10px 0; }
  .prod { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #e5e7eb; font-size: 14px; }
  .prod:last-child { border-bottom: 0; }
  .prod .qty { font-weight: 800; color: var(--orange); font-size: 15px; white-space: nowrap; }
  .prod .code { color: var(--muted); font-size: 12px; direction: ltr; text-align: start; }
  .total { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--success-bg); color: var(--success); border-radius: 8px; margin: 10px 0; font-weight: 800; font-size: 16px; }
  .btn { display: inline-block; padding: 12px 16px; border-radius: 10px; border: 0; font-weight: 800; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-success { background: var(--success); color: #fff; width: 100%; margin-top: 8px; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .call-btns { display: flex; gap: 8px; margin-top: 8px; }
  .call-btns a { flex: 1; text-decoration: none; text-align: center; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 14px; }
  .call-btns .call { background: #dbeafe; color: #1e40af; }
  .call-btns .wa { background: #dcfce7; color: #15803d; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .em { font-size: 56px; margin-bottom: 12px; }
  .fab { position: fixed; bottom: 20px; inset-inline-end: 20px; background: var(--orange); color: #fff; border: 0; width: auto; padding: 14px 20px; border-radius: 999px; font-weight: 800; font-size: 15px; box-shadow: 0 6px 16px rgba(242,106,33,.4); cursor: pointer; font-family: inherit; z-index: 15; }

  /* PIN gate */
  .gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; padding: 20px; }
  .gate .logo { font-size: 40px; margin-bottom: 12px; }
  .gate h1 { margin: 0 0 6px 0; font-size: 24px; color: var(--orange); }
  .gate p { color: var(--muted); margin: 0 0 24px 0; }
  .gate input { width: 100%; max-width: 260px; padding: 14px; font-size: 22px; text-align: center; border: 2px solid var(--line); border-radius: 12px; letter-spacing: 8px; font-family: inherit; }
  .gate input:focus { outline: none; border-color: var(--orange); }
  .gate .err { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .gate button { margin-top: 14px; width: 100%; max-width: 260px; }

  /* Picking-list modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 20px; }
  .modal.open { display: flex; }
  .modal .sheet { background: #fff; border-radius: 14px; width: 100%; max-width: 500px; padding: 18px; margin: 20px 0; }
  .modal h3 { margin: 0 0 12px 0; }
  .modal .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); align-items: center; }
  .modal .item .n { font-weight: 700; }
  .modal .item .c { font-size: 11px; color: var(--muted); direction: ltr; text-align: start; }
  .modal .item .q { font-weight: 800; color: var(--orange); font-size: 16px; grid-row: span 2; }
  .modal .close { background: transparent; border: 0; font-size: 22px; float: inline-end; cursor: pointer; color: var(--muted); }

  @media print {
    header, .fab, .modal .close, .btn-success, .call-btns { display: none !important; }
    .card, body { box-shadow: none !important; }
  }
</style>
</head>
<body>

<!-- PIN GATE -->
<div id="gate" class="gate">
  <div class="logo">📦</div>
  <h1>بروتيك — تجهيز الطلبات</h1>
  <p>أدخل رمز الدخول</p>
  <input id="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="****" maxlength="10" autocomplete="off">
  <div id="pin-err" class="err"></div>
  <button class="btn btn-primary" onclick="tryLogin()">دخول</button>
</div>

<!-- APP (hidden until logged in) -->
<div id="app" style="display:none">
  <header>
    <h1>📦 تجهيز الطلبات</h1>
    <span class="count" id="count">…</span>
  </header>
  <main>
    <div id="list"></div>
  </main>
  <button class="fab" onclick="openTodayList()">📋 قائمة اليوم</button>
</div>

<!-- Today's picking list modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" onclick="closeModal()">✕</button>
    <h3>📋 قائمة اليوم — كل الأصناف</h3>
    <div id="modal-body"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="window.print()">🖨️ طباعة</button>
  </div>
</div>

<script>
const API = '/api/sync-status?action=picker';
const PIN_KEY = 'protech_picker_pin_v1';

function getPin() { try { return sessionStorage.getItem(PIN_KEY) || ''; } catch { return ''; } }
function savePin(p) { try { sessionStorage.setItem(PIN_KEY, p); } catch {} }
function clearPin() { try { sessionStorage.removeItem(PIN_KEY); } catch {} }

async function apiCall(op, extra = {}) {
  const pin = getPin();
  const q = new URLSearchParams({ op, pin, ...extra }).toString();
  const r = await fetch(`${API}&${q}`);
  if (r.status === 401) { clearPin(); showGate('رمز الدخول غير صحيح'); throw new Error('unauth'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'server error');
  return j;
}

function showGate(err) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('pin-err').textContent = err || '';
  setTimeout(() => document.getElementById('pin-input').focus(), 50);
}
function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadOrders();
}

async function tryLogin() {
  const p = document.getElementById('pin-input').value.trim();
  if (!p) { document.getElementById('pin-err').textContent = 'اكتب الرمز'; return; }
  savePin(p);
  try { await apiCall('list'); showApp(); }
  catch (e) { /* apiCall already handled 401 */ }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('gate').style.display !== 'none') tryLogin();
});

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }
function money(n) { const x = Number(n||0); return x.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function waLink(phone, name) {
  const p = String(phone||'').replace(/[^0-9+]/g, '');
  return `https://wa.me/${p.replace(/^\+/, '')}`;
}
function telLink(phone) {
  const p = String(phone||'').replace(/[^0-9+]/g, '');
  return 'tel:' + p;
}

function orderCard(o) {
  const products = (o.products || []).map(p => `
    <div class="prod">
      <div>
        <div>${esc(p.name || p.code || 'منتج')}</div>
        <div class="code">${esc(p.code || '')}</div>
      </div>
      <div class="qty">×${p.qty}</div>
    </div>`).join('');
  return `
    <div class="card">
      <span class="order-code">${esc(o.code || '')}</span>
      ${o.allow_open ? '<span class="badge-open">📦 فتح الشحنة</span>' : ''}
      <h2 class="customer">${esc(o.customer_name || 'عميل')}</h2>
      <div class="address">📍 ${esc(o.city || '')}${o.address ? ' — ' + esc(o.address) : ''}</div>
      ${o.notes ? `<div class="address" style="color:#92400e;background:#fef3c7;padding:6px 8px;border-radius:6px;margin:6px 0">📝 ${esc(o.notes)}</div>` : ''}
      <div class="call-btns">
        <a class="call" href="${telLink(o.phone)}">📞 اتصال</a>
        <a class="wa" href="${waLink(o.phone)}" target="_blank">💬 واتساب</a>
      </div>
      <div class="products">${products || '<em style="color:var(--muted)">لا يوجد منتجات مضافة</em>'}</div>
      <div class="total"><span>الإجمالي</span><span>${money(o.total)} ج.م</span></div>
      <button class="btn btn-success" onclick="markPrepared('${esc(o.id)}', this)">✅ تم التجهيز</button>
    </div>`;
}

async function loadOrders() {
  document.getElementById('list').innerHTML = '<div class="empty">جاري التحميل…</div>';
  try {
    const j = await apiCall('list');
    const orders = j.orders || [];
    document.getElementById('count').textContent = `${orders.length} طلب`;
    document.getElementById('list').innerHTML = orders.length
      ? orders.map(orderCard).join('')
      : '<div class="empty"><div class="em">✅</div><div>لا توجد طلبات لتجهيزها الآن</div></div>';
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="empty"><div class="em">⚠️</div><div>خطأ: ${esc(e.message)}</div></div>`;
  }
}

async function markPrepared(orderId, btn) {
  if (!confirm('تأكيد تجهيز هذا الطلب؟')) return;
  btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try {
    await apiCall('mark', { orderId });
    // Optimistically remove the card from view.
    btn.closest('.card').style.transition = 'opacity .3s'; btn.closest('.card').style.opacity = '0';
    setTimeout(() => loadOrders(), 300);
  } catch (e) {
    btn.disabled = false; btn.textContent = '✅ تم التجهيز';
    alert('فشل الحفظ: ' + e.message);
  }
}

async function openTodayList() {
  document.getElementById('modal-body').innerHTML = '<div class="empty">جاري التحميل…</div>';
  document.getElementById('modal').classList.add('open');
  try {
    const j = await apiCall('today');
    const items = j.items || [];
    document.getElementById('modal-body').innerHTML = items.length
      ? items.map(i => `
          <div class="item">
            <div class="n">${esc(i.name || i.code)}</div>
            <div class="q">×${i.qty}</div>
            <div class="c">${esc(i.code || '')}</div>
            <div></div>
          </div>`).join('')
      : '<div class="empty">لا توجد أصناف</div>';
  } catch (e) {
    document.getElementById('modal-body').innerHTML = `<div class="empty">خطأ: ${esc(e.message)}</div>`;
  }
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

// Boot — auto-enter if a PIN is already saved for this session
if (getPin()) {
  apiCall('list').then(() => showApp()).catch(() => showGate(''));
} else {
  showGate('');
}

// Refresh every 60s while visible so newly-confirmed orders appear
setInterval(() => {
  if (document.getElementById('app').style.display !== 'none' && !document.hidden) loadOrders();
}, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.getElementById('app').style.display !== 'none') loadOrders();
});
</script>
</body>
</html>
